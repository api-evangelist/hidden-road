  spec_location: >-
    https://static.hiddenroad.com/mica-post-trade-transparency/2026-08-21_mica_civnl_otcspot.csv
    (HTTP 200) — header row
  note: >-
    This is the ONLY machine-readable contract-shaped artifact Hidden Road publishes to the
    public. It is a regulator-mandated file feed rather than an API, and it is published because
