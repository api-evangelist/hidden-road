generated: '2026-08-22'
method: probed
source: Live unauthenticated requests to https://api.hiddenroad.com/v0/* on 2026-08-22
format: aws-api-gateway-default
rfc9457: false
rfc9457_note: >-
  Responses are NOT application/problem+json. The envelope observed on every unauthenticated
  request is AWS API Gateway's default single-key JSON object, with no type, title, detail,
  instance, or error code. There is no published error reference; nothing beyond the
  authentication boundary could be observed without credentials.
envelope:
  content_type: application/json
  shape: '{"message": "<string>"}'
  fields:
  - name: message
    type: string
    description: Human-readable text. No stable machine-readable code accompanies it.
  missing:
  - A stable error code an agent can branch on
  - A correlation / request id in the body (see x-amzn-RequestId header below)
  - A documentation link per error
  - RFC 9457 problem+json media type
correlation_headers:
- x-amzn-RequestId
- x-amzn-ErrorType
- x-amz-apigw-id
- x-amzn-Trace-Id
problem_types:
- status: 401
  title: Unauthorized
  body: '{"message":"Unauthorized"}'
  meaning: >-
    The path is a real, routed Hidden Road API operation and a valid OAuth 2.0 bearer token
    from https://auth.hiddenroad.com/ is required.
  observed_on:
  - https://api.hiddenroad.com/v0/accountactivity/ping
  - https://api.hiddenroad.com/v0/atm/ping
  - https://api.hiddenroad.com/v0/metrics/ping
  - https://api.hiddenroad.com/v0/otc/ping
  - https://api.sandbox.hiddenroad.com/v0/otc/ping
  remediation: Obtain a token via client_credentials at https://auth.hiddenroad.com/oauth/token.
- status: 403
  title: Missing Authentication Token
  body: '{"message":"Missing Authentication Token"}'
  header: 'x-amzn-ErrorType: MissingAuthenticationTokenException'
  meaning: >-
    Despite the wording, this is API Gateway's NOT-ROUTED response, not an auth failure. Every
    unmapped path on api.hiddenroad.com and api.sandbox.hiddenroad.com returns it, including
    the host root and every /.well-known/* path.
  observed_on:
  - https://api.hiddenroad.com/
  - https://api.hiddenroad.com/v0/
  - https://api.hiddenroad.com/v0/openapi.json
  - https://api.sandbox.hiddenroad.com/v0/accountactivity/ping
  remediation: >-
    Check the path. The message is misleading — an integrator reading it as an auth problem
    will retry with credentials forever.
  finding: >-
    This 401-vs-403 asymmetry is the single most useful undocumented behaviour on the surface:
    it is what allowed four live service routes to be confirmed anonymously.
