- name: Hidden Road MiCA Post-Trade Transparency Feed
  description: >-
    A daily CSV feed of OTC spot crypto-asset transactions executed by Hidden Road Partners CIV
    NL B.V., published under the EU Markets in Crypto-Assets Regulation post-trade transparency
    obligation. Files follow a stable, dated key pattern
    (YYYY-MM-DD_mica_civnl_otcspot.csv) and a fixed 13-column ESMA-shaped schema. Public,
    unauthenticated and current — the series runs from 2025-03-02 to the previous business day.
  humanURL: https://ripple.com/legal/compliance/
  baseURL: https://static.hiddenroad.com/mica-post-trade-transparency
