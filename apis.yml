aid: hidden-road
name: Hidden Road
description: >-
  Hidden Road is a global, multi-asset non-bank prime broker and clearing firm serving
  institutional counterparties across digital assets, foreign exchange, precious metals,
  exchange-traded derivatives, OTC swaps and fixed-income repo. Ripple acquired Hidden Road
  for $1.25B in 2025 and now operates it as Ripple Prime; hiddenroad.com redirects to
  ripple.com/products/prime-brokerage/. Hidden Road ships a real, customer-only API suite —
  the Account Activity API (streamed balances, trades, positions and fees over a bitemporal
  store), the Risk API (real-time margin utilisation and tail-risk metrics), the Automated
  Treasury Management API (programmatic collateral and credit-limit distribution) and an OTC
  surface — served from https://api.hiddenroad.com/v0/ behind an Auth0 OAuth 2.0 / OIDC
  authorization server at auth.hiddenroad.com. No public reference, OpenAPI, SDK or sandbox
  documentation is published; the only machine-readable artifact a member of the public can
  read is the daily MiCA post-trade transparency CSV feed the firm's Netherlands entity
  publishes under its EU regulatory obligation.
