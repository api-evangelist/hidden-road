apis:
- name: Hidden Road API (v0)
  description: >-
    The Hidden Road prime brokerage and clearing API suite, announced generally available on
    2023-05-04. Four service surfaces are confirmed live under https://api.hiddenroad.com/v0/ —
    accountactivity, metrics (risk), atm (automated treasury management) and otc. Every path
    answers 401 Unauthorized rather than the API Gateway 403 "Missing Authentication Token"
    served for unrouted paths, which is how each route was confirmed to exist without
    credentials. Access is OAuth 2.0 bearer, issued by the Auth0 tenant at auth.hiddenroad.com
    with audience https://api.hiddenroad.com/v0/. No public reference or OpenAPI is published.
  humanURL: https://ripple.com/products/prime-brokerage/
